name: kalshi-team

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalshi-team
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run one cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOT_PAUSED: ${{ vars.BOT_PAUSED }}
        run: python bot.py
      - name: Save state
        run: |
          git config user.name "kalshi-bot"
          git config user.email "kalshi-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "bot update"
          git pull --rebase
          git push
